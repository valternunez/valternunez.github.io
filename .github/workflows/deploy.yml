name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs for the same ref.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Tectonic bundle
        uses: actions/cache@v4
        with:
          path: ~/.cache/Tectonic
          key: tectonic-bundle-${{ runner.os }}-0.17.0

      - name: Install Tectonic
        run: |
          curl -fsSL "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-unknown-linux-gnu.tar.gz" -o tectonic.tar.gz
          tar -xzf tectonic.tar.gz
          sudo install -m 755 tectonic /usr/local/bin/tectonic
          rm -f tectonic.tar.gz tectonic
          tectonic --version

      - name: Compile CV PDFs
        run: |
          mkdir -p public/cv
          for f in cv-src/*.tex; do
            echo "::group::$f"
            tectonic -X compile --outdir public/cv "$f"
            echo "::endgroup::"
          done
          ls -l public/cv

      - name: Check every CV still fits on one page
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          fail=0
          for p in public/cv/*.pdf; do
            pages=$(pdfinfo "$p" | awk '/^Pages:/ {print $2}')
            if [ "$pages" = "1" ]; then
              echo "$(basename "$p"): 1 page"
            else
              echo "::error::$(basename "$p") is $pages pages - these CVs must fit on one page; trim the source in cv-src/"
              fail=1
            fi
          done
          exit $fail

      - name: Upload CV PDFs as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdfs
          path: public/cv/*.pdf

      - name: Install, build, and upload
        uses: withastro/action@v3
        # Defaults: package manager auto-detected, build → ./dist, Node 20.

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
